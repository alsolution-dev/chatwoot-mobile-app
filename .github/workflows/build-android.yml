name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🏗 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install PNPM
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: 📦 Install dependencies
        # O comando '--no-frozen-lockfile' evita erros se o arquivo de lock estiver ausente
        run: pnpm install --no-frozen-lockfile

      - name: 🚀 Build APK
        # Adicionei o comando --no-install para garantir que ele use o que foi instalado no passo anterior
        run: npx eas-cli build --platform android --profile preview --local --non-interactive --no-install
