name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📂 Injetar Google Services (Hard Fix)
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json
          git config --global user.email "felipe@alsolution.net.br"
          git config --global user.name "Felipe Alves"
          git add -f google-services.json
          ls -la google-services.json

      - name: 📦 Setup PNPM e EAS
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          npm install -g eas-cli

      - name: 📦 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🚀 Build APK
        run: eas build --platform android --profile production --local --non-interactive --clear-cache
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NODE_ENV: production
