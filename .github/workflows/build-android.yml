name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📂 Injetar Google Services (Hard Fix)
        # Criamos o arquivo e o colocamos na raiz e na pasta android/app ANTES de qualquer comando
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          ls -la google-services.json
          ls -la android/app/google-services.json

      - name: 📦 Setup PNPM e EAS
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          npm install -g eas-cli

      - name: 📦 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🚀 Build APK
        # O clear-cache limpa o erro de caminho persistente que vimos no seu log
        run: eas build --platform android --profile production --local --non-interactive --clear-cache
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NODE_ENV: production
