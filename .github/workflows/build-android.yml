name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🏗 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📂 Injetar Google Services
        # Criamos a estrutura de pastas nativa e colocamos o arquivo lá manualmente
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json || true
          ls -R android/app

      - name: 📦 Install PNPM
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: 📦 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🚀 Build APK
        # O uso do --clear-cache é fundamental para limpar os erros de path anteriores
        run: npx eas-cli build --platform android --profile production --local --non-interactive --clear-cache
