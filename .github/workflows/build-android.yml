name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🏗 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📂 Injetar Google Services (Ajuste Técnico)
        # Este comando cria a pasta NO SERVIDOR e copia o arquivo da sua RAIZ para lá
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json || true
          echo "Verificando se o arquivo foi injetado no servidor:"
          ls -la android/app/google-services.json

      - name: 📦 Install PNPM
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: 📦 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🚀 Build APK
        # O clear-cache limpa os erros de caminhos antigos que ficaram na memória do Expo
        run: npx eas-cli build --platform android --profile production --local --non-interactive --clear-cache
