name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🏗 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📂 Debug e Injeção
        run: |
          # Cria o arquivo a partir do seu secret
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json
          # Verifica se o arquivo tem conteúdo (não está vazio)
          ls -la google-services.json
          cat google-services.json | head -n 5
          # Cria a pasta nativa por segurança
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: 📦 Install PNPM
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: 📦 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🚀 Build APK
        # O clear-cache é OBRIGATÓRIO para limpar o erro anterior
        run: npx eas-cli build --platform android --profile production --local --non-interactive --clear-cache
