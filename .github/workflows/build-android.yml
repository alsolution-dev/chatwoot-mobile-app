name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Removi a linha de cache que causou o erro anterior

      - name: 🏗 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        # Note que no seu print existe um arquivo pnpm-lock.yaml. 
        # Vamos usar o comando do pnpm para garantir compatibilidade.
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile

      - name: 🚀 Build APK
        run: npx eas-cli build --platform android --profile preview --local --non-interactive
