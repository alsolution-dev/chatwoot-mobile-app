name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🏗 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install PNPM
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: 📦 Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          # Aprova scripts de build para evitar travamentos em pacotes como sentry e esbuild
          pnpm approve-builds || true

      - name: 🚀 Build APK
        # Limpa o cache para forçar o prebuild com as novas versões de SDK
        run: npx eas-cli build --platform android --profile production --local --non-interactive --clear-cache
